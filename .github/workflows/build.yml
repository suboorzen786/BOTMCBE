name: Build BOTMC APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Binary / Placeholder
      run: |
        go build -o botmc_app main.go || echo "Main.go will be added soon"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: botmc-build
        path: .

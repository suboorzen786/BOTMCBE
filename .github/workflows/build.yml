name: Build BOTMC APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Go Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install System CGO & Android Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libx11-dev xorg-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev

    - name: Clean & Tidy Dependencies
      run: |
        go mod tidy

    - name: Install Gomobile Tools
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        export PATH=$PATH:$(go env GOPATH)/bin
        gomobile init

    - name: Compile Android APK
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        gomobile build -target=android -o botmc.apk .

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: botmc-apk
        path: botmc.apk

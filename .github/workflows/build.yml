name: Build BOTMC Test APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Go Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install System Dependencies & Java
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libx11-dev openjdk-17-jdk

    - name: Install Gogio Compiler Tool
      run: |
        go install gioui.org/cmd/gogio@v0.10.3
        export PATH=$PATH:$(go env GOPATH)/bin

    - name: Tidy Dependencies
      run: |
        go mod tidy

    - name: Build Android APK with Gogio
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        gogio -target android -appid com.suboorzen.botmc -o botmc.apk .

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: botmc-apk
        path: botmc.apk

name: Build BOTMC APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libx11-dev xorg-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev

    - name: Install Gio Tool (gioc)
      run: |
        go install gioui.org/cmd/gioc@latest

    - name: Build APK using gioc
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        gioc -target android -o botmc.apk .

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: botmc-apk
        path: botmc.apk

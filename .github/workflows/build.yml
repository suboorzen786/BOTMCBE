name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve Go modules
        run: |
          go get gioui.org@latest
          go get github.com/sandertv/gophertunnel@latest
          go mod tidy

      - name: Install gogio
        run: go install gioui.org/cmd/gogio@latest

      - name: Build APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          gogio -target android -appid com.suboorzen.botmc -o botmc.apk .

      - uses: actions/upload-artifact@v4
        with:
          name: botmc-apk
          path: botmc.apk
